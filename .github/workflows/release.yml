name: Release Build (debug)

on:
  workflow_dispatch:
  push:
    branches: [LastChat]
    paths: [".github/workflows/release.yml", "app/**", "web-ui/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Web UI deps
        working-directory: web-ui
        run: npm ci

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStableDebug --no-daemon -Plastchat.abi.splits=false

      - name: Collect APK
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          cd dist
          for f in *.apk; do mv "$f" "LastNap_1.4.8_debug.apk"; done
          ls -la

      - name: Tag
        run: |
          git config user.name "LastNap Bot"
          git config user.email "actions@users.noreply.github.com"
          git tag -f v1.4.8-lastnap
          git push origin v1.4.8-lastnap -f

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.8-lastnap
          name: LastNap 1.4.8 (debug)
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
